[project]
name = "project2"
version = "0.1.0"
description = "A terminal coding assistant powered by Deep Agents, Ollama, and OpenRouter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.23",
    "fastmcp>=2.14.0",
    "langchain>=1.4.4",
    "langchain-openrouter>=0.2.9",
    "langchain-ollama>=0.3.0",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "ollama>=0.6.3",
    "python-dotenv>=1.2.4",
    "prompt-toolkit>=3.0.48",
    "rich>=13.9.4",
    "tavily-python>=0.8.5",
]

[project.scripts]
codex-agent = "main:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "sandbox*", "ui*"]

[tool.setuptools]
py-modules = ["main", "ollama_config"]
